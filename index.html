<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liberty Grace — Private Travel, Kenya &amp; Beyond | Coming Soon</title>
<meta name="description" content="Liberty Grace — private travel from Kenya and beyond. Our new website is coming soon. Contact liberty@travelwithlibertygrace.com or +254 714 890 246.">
<meta property="og:title" content="Liberty Grace — Private Travel">
<meta property="og:description" content="Private travel, Kenya & beyond. Our new website is coming soon.">
<meta property="og:url" content="https://travelwithlibertygrace.com">
<meta name="theme-color" content="#F3F1EA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235F7158'/%3E%3Ccircle cx='32' cy='30' r='12' fill='%23A54E32'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #F3F1EA;
    --ink: #2B2724;
    --muted: #4A4440;
    --terracotta: #A54E32;
    --terracotta-dark: #7E3A24;
    --sage: #5F7158;
    --forest: #2F382C;
    --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --sans: 'Jost', 'Helvetica Neue', Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 1.0625rem;
    line-height: 1.65;
  }
  a { color: var(--terracotta); text-decoration: none; }
  a:hover { color: var(--terracotta-dark); }
  a:focus-visible { outline: 2px solid var(--terracotta); outline-offset: 4px; border-radius: 2px; }

  header { padding: 32px clamp(20px, 5vw, 72px); }
  .logo { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-name { font-family: var(--serif); font-size: 1.75rem; font-weight: 500; letter-spacing: 0.28em; }
  .logo-sub { font-size: 0.6875rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--sage); font-weight: 400; margin-top: 4px; }

  main {
    flex: 1 0 auto;
    width: 100%;
    max-width: 1320px;
    margin: 0 auto;
    padding: clamp(32px, 6vw, 80px) clamp(20px, 5vw, 72px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 56px;
  }
  .copy { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
  .eyebrow { margin: 0; font-size: 0.8125rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--sage); font-weight: 400; }
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(3rem, 7vw, 6rem); line-height: 1; }
  h1 em { color: var(--terracotta); }
  .lead { margin: 0; max-width: 30rem; font-size: 1.1875rem; color: var(--muted); }
  .contact { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; padding-top: 24px; border-top: 1px solid rgba(43,39,36,0.15); max-width: 30rem; }
  .contact-label { margin: 0 0 6px; font-size: 0.75rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--sage); font-weight: 400; }
  .contact a { font-family: var(--serif); font-size: 1.5rem; overflow-wrap: anywhere; }

  .art { flex: 1 1 340px; min-width: 0; display: flex; justify-content: center; }
  .art svg { width: 100%; max-width: 380px; height: auto; }

  footer { background: var(--forest); color: #E6E8DF; padding: 28px clamp(20px, 5vw, 72px); }
  .footer-inner { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.875rem; }
  .footer-name { letter-spacing: 0.24em; text-transform: uppercase; font-size: 0.75rem; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-name">LIBERTY GRACE</span>
    <span class="logo-sub">Private Travel</span>
  </div>
</header>

<main>
  <div class="copy">
    <p class="eyebrow">Private Travel • Kenya &amp; Beyond</p>
    <h1>Coming <em>soon.</em></h1>
    <p class="lead">Our new website is on its way. Please check back shortly.</p>
    <div class="contact">
      <p class="contact-label">In the meantime, get in touch</p>
      <a href="mailto:liberty@travelwithlibertygrace.com">liberty@travelwithlibertygrace.com</a>
      <a href="tel:+254714890246">+254 714 890 246</a>
    </div>
  </div>
  <div class="art">
    <svg viewBox="0 0 400 500" aria-hidden="true">
      <defs>
        <clipPath id="lgArch"><path d="M0 500 V200 A200 200 0 0 1 400 200 V500 Z"/></clipPath>
      </defs>
      <g clip-path="url(#lgArch)">
        <rect width="400" height="500" fill="#E9DCCB"/>
        <circle cx="250" cy="250" r="62" fill="#A54E32"/>
        <path d="M0 330 Q90 280 180 318 T400 300 V500 H0 Z" fill="#5F7158" opacity="0.55"/>
        <path d="M0 380 Q120 340 230 372 T400 360 V500 H0 Z" fill="#5F7158" opacity="0.8"/>
        <path d="M0 430 Q140 400 260 425 T400 418 V500 H0 Z" fill="#3E4A3A"/>
        <g fill="#2F382C">
          <rect x="96" y="318" width="4" height="70"/>
          <path d="M58 322 Q98 296 140 322 Q98 312 58 322 Z"/>
          <path d="M66 312 Q98 290 132 312 Q98 304 66 312 Z"/>
        </g>
      </g>
      <path d="M2 500 V200 A198 198 0 0 1 398 200 V500" fill="none" stroke="#2B2724" stroke-opacity="0.2" stroke-width="1"/>
    </svg>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <span class="footer-name">Liberty Grace</span>
    <span>travelwithlibertygrace.com</span>
  </div>
</footer>

</body>
</html>
